<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo y Gestión de Zapatillas Deportivas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <nav class="bg-orange-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-shoe-prints"></i> SportShoes Control & Ventas
            </h1>
            <span class="bg-orange-700 px-3 py-1 rounded-full text-xs font-semibold">
                Vendedor: 929188138
            </span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        
        <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="w-full md:w-auto flex items-center gap-2 flex-grow max-w-lg">
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input id="txtBuscarMarca" type="text" placeholder="Ingresar la marca a buscar... (ej. Nike)" class="w-full pl-10 pr-4 py-2 border rounded-lg border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
                </div>
                <button onclick="buscarPorMarca()" class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2 rounded-lg font-semibold text-sm transition shadow flex items-center gap-1 cursor-pointer">
                    Buscar
                </button>
                <button onclick="limpiarBusqueda()" class="bg-slate-200 hover:bg-slate-300 text-slate-600 px-3 py-2 rounded-lg font-medium text-sm transition" title="Limpiar filtro">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>

            <button onclick="formularioZapatilla()" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition shadow flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-plus"></i> Registrar Nueva Zapatilla
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 bg-slate-50 border-b border-slate-200">
                <h2 class="font-bold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-orange-500"></i> Stock Disponible en Catálogo
                </h2>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase font-semibold">
                            <th class="p-3 text-center">#</th>
                            <th class="p-3">Marca</th>
                            <th class="p-3">Modelo</th>
                            <th class="p-3">Colores</th>
                            <th class="p-3 text-center">Talla</th>
                            <th class="p-3 text-center">Catálogo</th>
                            <th class="p-3 text-center">Pedido</th>
                            <th class="p-3 text-center">Acciones de Gestión</th>
                            <th class="p-3 text-center">Pedidos WhatsApp</th>
                        </tr>
                    </thead>
                    <tbody id="tablaZapatillas" class="text-sm divide-y divide-slate-200">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modalQR" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden" onclick="cerrarModalQR()">
        <div class="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full text-center space-y-4 mx-4" onclick="event.stopPropagation()">
            <h3 class="font-bold text-slate-800 text-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-qrcode text-orange-500"></i> QR de Pedido Rápido
            </h3>
            <p class="text-xs text-slate-500">Escanea este código con tu celular para enviar la orden directamente por WhatsApp.</p>
            <div id="contenedorQR" class="flex justify-center p-3 bg-white border rounded-lg mx-auto w-fit"></div>
            <div id="textoDetalleQR" class="text-xs font-mono font-semibold text-slate-600 bg-slate-100 py-2 rounded"></div>
            <button onclick="cerrarModalQR()" class="bg-slate-600 hover:bg-slate-700 text-white w-full py-2 rounded-lg text-sm font-semibold transition cursor-pointer">
                Cerrar Ventana
            </button>
        </div>
    </div>

    <script>
        // Número de contacto fijo configurado por el usuario
        const WHATSAPP_VENDEDOR = "929188138";

        // 1. DATA INICIAL REQUERIDA (10 Registros base de Zapatillas)
        const listaInicial = [
            { id: 1, marca: "Nike", modelo: "Air Force 1 '07", colores: "Blanco / Azul University", talla: "42", catalogo: "CAT-NK-001", pedido: "PED-9012", telefono: "987654321" },
            { id: 2, marca: "Adidas", modelo: "Ultraboost Light", colores: "Negro / Gris Carbón", talla: "40", catalogo: "CAT-AD-045", pedido: "PED-9013", telefono: "951847263" },
            { id: 3, marca: "Puma", modelo: "RS-X Reinvent", colores: "Beige / Rosa Pastel", talla: "38", catalogo: "CAT-PM-112", pedido: "PED-9014", telefono: "912345678" },
            { id: 4, marca: "New Balance", modelo: "550 Classic", colores: "Blanco / Verde Bosque", talla: "41", catalogo: "CAT-NB-550", pedido: "PED-9015", telefono: "963852741" },
            { id: 5, marca: "Jordan", modelo: "Air Jordan 1 Retro", colores: "Rojo / Blanco / Negro", talla: "43", catalogo: "CAT-JD-023", pedido: "PED-9016", telefono: "947153286" },
            { id: 6, marca: "Asics", modelo: "Gel-Kayano 29", colores: "Azul Marino / Lima", talla: "42", catalogo: "CAT-AS-223", pedido: "PED-9017", telefono: "935628147" },
            { id: 7, marca: "Reebok", modelo: "Club C 85", colores: "Blanco Vintage / Navy", talla: "39", catalogo: "CAT-RB-885", pedido: "PED-9018", telefono: "921748359" },
            { id: 8, marca: "Under Armour", modelo: "Hovr Phantom 3", colores: "Negro Total", talla: "44", catalogo: "CAT-UA-664", pedido: "PED-9019", telefono: "974123658" },
            { id: 9, marca: "Vans", modelo: "Old Skool", colores: "Negro / Blanco / Cuadros", talla: "37", catalogo: "CAT-VS-442", pedido: "PED-9020", telefono: "956321478" },
            { id: 10, marca: "Converse", modelo: "Chuck 70 Hi", colores: "Amarillo Girasol", talla: "36", catalogo: "CAT-CV-331", pedido: "PED-9021", telefono: "989654123" }
        ];

        // Inicialización de la base de datos en almacenamiento local (LocalStorage)
        let zapatillas = JSON.parse(localStorage.getItem('db_zapatillas')) || listaInicial;
        let filtroMarca = ""; // Guarda el criterio de búsqueda

        document.addEventListener('DOMContentLoaded', () => {
            guardarStorage();
            renderTabla();
        });

        function guardarStorage() {
            localStorage.setItem('db_zapatillas', JSON.stringify(zapatillas));
        }

        // ========================================================
        // RENDER DE TABLA (CON FILTRO EXCLUSIVO DE MARCA)
        // ========================================================
        function renderTabla() {
            const tbody = document.getElementById('tablaZapatillas');
            tbody.innerHTML = '';

            // Filtrado: comprueba si coincide con la marca ingresada (insensible a mayúsculas/minúsculas)
            const datosFiltrados = zapatillas.filter(z => 
                z.marca.toLowerCase().includes(filtroMarca.toLowerCase())
            );

            if (datosFiltrados.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="p-8 text-center text-slate-400 font-medium">
                            <i class="fa-solid fa-circle-info text-xl mb-1 block text-slate-300"></i>
                            No se encontraron zapatillas con la marca ingresada.
                        </td>
                    </tr>
                `;
                return;
            }

            datosFiltrados.forEach((z, indice) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition align-middle";
                tr.innerHTML = `
                    <td class="p-3 text-center font-bold text-slate-400">${indice + 1}</td>
                    <td class="p-3 font-bold text-orange-600">${z.marca}</td>
                    <td class="p-3 font-semibold text-slate-800">${z.modelo}</td>
                    <td class="p-3 text-slate-600 text-xs">${z.colores}</td>
                    <td class="p-3 text-center font-semibold bg-slate-50">${z.talla}</td>
                    <td class="p-3 text-center font-mono text-xs text-slate-500">${z.catalogo}</td>
                    <td class="p-3 text-center font-mono text-xs font-bold text-slate-700">${z.pedido}</td>
                    <td class="p-3 text-center">
                        <div class="inline-flex gap-1">
                            <button onclick="formularioZapatilla(${z.id})" class="text-blue-600 hover:bg-blue-50 p-2 rounded transition cursor-pointer" title="Editar datos con 1 clic">
                                <i class="fa-solid fa-pen-to-square"></i> Editar
                            </button>
                            <button onclick="eliminarZapatilla(${z.id})" class="text-red-500 hover:bg-red-50 p-2 rounded transition cursor-pointer" title="Eliminar registro con 1 clic">
                                <i class="fa-solid fa-trash-can"></i> Borrar
                            </button>
                        </div>
                    </td>
                    <td class="p-3 text-center">
                        <div class="flex flex-col sm:flex-row justify-center gap-1.5">
                            <button onclick="enviarPedidoWhatsApp(${z.id})" class="bg-emerald-500 hover:bg-emerald-600 text-white px-2 py-1.5 rounded-md text-xs font-bold transition flex items-center justify-center gap-1 shadow cursor-pointer" title="Hacer pedido instantáneo">
                                <i class="fa-brands fa-whatsapp text-sm"></i> Enviar Link
                            </button>
                            <button onclick="mostrarQRDePedido(${z.id})" class="bg-violet-600 hover:bg-violet-700 text-white px-2 py-1.5 rounded-md text-xs font-bold transition flex items-center justify-center gap-1 shadow cursor-pointer" title="Ver código QR para escaneo móvil">
                                <i class="fa-solid fa-qrcode"></i> Ver QR
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ========================================================
        // CONTROLADORES DE BÚSQUEDA (CON BOTÓN DE INGRESAR MARCA)
        // ========================================================
        function buscarPorMarca() {
            const input = document.getElementById('txtBuscarMarca');
            filtroMarca = input.value.trim();
            renderTabla();
        }

        function limpiarBusqueda() {
            document.getElementById('txtBuscarMarca').value = "";
            filtroMarca = "";
            renderTabla();
        }

        // ========================================================
        // CRUD DE GESTIÓN MÁS FORMULARIOS (CON 1 CLIC)
        // ========================================================
        async function formularioZapatilla(idEditar = null) {
            const esEdicion = idEditar !== null;
            const item = zapatillas.find(z => z.id === idEditar) || { marca: '', modelo: '', colores: '', talla: '', catalogo: '', pedido: '', telefono: '' };

            const { value: formValues } = await Swal.fire({
                title: esEdicion ? '✏️ Editar Datos de Zapatilla' : '👟 Registrar Nueva Zapatilla / Marca',
                confirmButtonColor: '#ea580c', // Color naranja corporativo
                cancelButtonColor: '#64748b',
                showCancelButton: true,
                confirmButtonText: 'Guardar cambios',
                cancelButtonText: 'Cancelar',
                html: `
                    <div class="text-left space-y-3 p-1 text-sm">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Marca Deportiva</label>
                                <input id="swal-marca" class="w-full p-2 border rounded border-slate-300" type="text" placeholder="Ej. Nike" value="${item.marca}">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Modelo</label>
                                <input id="swal-modelo" class="w-full p-2 border rounded border-slate-300" type="text" placeholder="Ej. Air Max" value="${item.modelo}">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Combinación de Colores</label>
                            <input id="swal-colores" class="w-full p-2 border rounded border-slate-300" type="text" placeholder="Ej. Negro / Rojo" value="${item.colores}">
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Talla (EUR)</label>
                                <input id="swal-talla" class="w-full p-2 border rounded border-slate-300" type="number" placeholder="42" value="${item.talla}">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Código Catálogo</label>
                                <input id="swal-catalogo" class="w-full p-2 border rounded border-slate-300" type="text" placeholder="CAT-00" value="${item.catalogo}">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Código Pedido</label>
                                <input id="swal-pedido" class="w-full p-2 border rounded border-slate-300" type="text" placeholder="PED-00" value="${item.pedido}">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Teléfono Alternativo de Referencia</label>
                            <input id="swal-telefono" class="w-full p-2 border rounded border-slate-300" type="tel" placeholder="900000000" value="${item.telefono}">
                        </div>
                    </div>
                `,
                preConfirm: () => {
                    const marca = document.getElementById('swal-marca').value.trim();
                    const modelo = document.getElementById('swal-modelo').value.trim();
                    const colores = document.getElementById('swal-colores').value.trim();
                    const talla = document.getElementById('swal-talla').value.trim();
                    const catalogo = document.getElementById('swal-catalogo').value.trim();
                    const pedido = document.getElementById('swal-pedido').value.trim();
                    const telefono = document.getElementById('swal-telefono').value.trim();

                    if (!marca || !modelo || !talla || !catalogo || !pedido) {
                        Swal.showValidationMessage('Por favor completa los campos obligatorios del calzado');
                        return false;
                    }
                    return { marca, modelo, colores: colores || "Estándar", talla, catalogo, pedido, telefono: telefono || "Sin asignar" };
                }
            });

            if (formValues) {
                if (esEdicion) {
                    const index = zapatillas.findIndex(z => z.id === idEditar);
                    zapatillas[index] = { id: idEditar, ...formValues };
                    Swal.fire('¡Modificado!', 'El calzado se actualizó de inmediato con un clic.', 'success');
                } else {
                    const nuevoId = zapatillas.length > 0 ? Math.max(...zapatillas.map(z => z.id)) + 1 : 1;
                    zapatillas.push({ id: nuevoId, ...formValues });
                    Swal.fire('¡Registrado!', 'Nueva marca y zapatilla guardada correctamente.', 'success');
                }
                guardarStorage();
                renderTabla();
            }
        }

        function eliminarZapatilla(id) {
            const item = zapatillas.find(z => z.id === id);
            Swal.fire({
                title: '¿Eliminar registro?',
                text: `Vas a dar de baja la zapatilla ${item.marca} ${item.modelo}. Esta operación se ejecuta con un clic.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, borrar del stock'
            }).then((result) => {
                if (result.isConfirmed) {
                    zapatillas = zapatillas.filter(z => z.id !== id);
                    guardarStorage();
                    renderTabla();
                    Swal.fire('Eliminado', 'Se retiró el producto de tu catálogo.', 'success');
                }
            });
        }

        // ========================================================
        // MOTOR DE ENLACES EXTERNOS Y PEDIDOS DE WHATSAPP
        // ========================================================
        function construirTextoMensaje(zapatilla) {
            return encodeURIComponent(
                `👋 ¡Hola! Me interesa realizar un pedido de zapatillas deportivas:\n\n` +
                `👟 *Marca:* ${zapatilla.marca}\n` +
                `📌 *Modelo:* ${zapatilla.modelo}\n` +
                `🎨 *Colores:* ${zapatilla.colores}\n` +
                `📏 *Talla:* ${zapatilla.talla}\n` +
                `📁 *Catálogo:* ${zapatilla.catalogo}\n` +
                `📦 *Código de Pedido:* ${zapatilla.pedido}\n\n` +
                `Por favor, confirmar disponibilidad del artículo.`
            );
        }

        function enviarPedidoWhatsApp(id) {
            const zapatilla = zapatillas.find(z => z.id === id);
            const textoMensaje = construirTextoMensaje(zapatilla);
            // Crea el enlace directo a la API de WhatsApp para móviles y PC
            const urlWhatsApp = `https://api.whatsapp.com/send?phone=51${WHATSAPP_VENDEDOR}&text=${textoMensaje}`;
            window.open(urlWhatsApp, '_blank');
        }

        // ========================================================
        // GENERACIÓN Y CONTROL DE QR DINÁMICO
        // ========================================================
        let qrcodeInstance = null;

        function mostrarQRDePedido(id) {
            const zapatilla = zapatillas.find(z => z.id === id);
            const textoMensaje = construirTextoMensaje(zapatilla);
            const urlWhatsApp = `https://api.whatsapp.com/send?phone=51${WHATSAPP_VENDEDOR}&text=${textoMensaje}`;

            const contenedor = document.getElementById('contenedorQR');
            contenedor.innerHTML = ''; // Limpia el QR anterior

            // Genera la imagen QR dinámicamente apuntando a tu WhatsApp
            qrcodeInstance = new QRCode(contenedor, {
                text: urlWhatsApp,
                width: 180,
                height: 180,
                colorDark : "#1e293b",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });

            document.getElementById('textoDetalleQR').innerText = `${zapatilla.marca} - ${zapatilla.pedido}`;
            document.getElementById('modalQR').classList.remove('hidden');
        }

        function cerrarModalQR() {
            document.getElementById('modalQR').classList.add('hidden');
        }
    </script>
</body>
</html>
