<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportSneakers - Gestión de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap');
        
        body { font-family: 'Poppins', sans-serif; }
        .font-sport { font-family: 'Bebas Neue', cursive; }
        
        .card-sneaker:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }
        
        #qrcode img { margin: 0 auto; border: 10px solid white; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <nav class="bg-orange-600 shadow-xl sticky top-0 z-50 p-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-4xl font-sport tracking-widest flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> SPORTSNEAKERS
            </h1>
            
            <div class="flex w-full md:w-1/2 gap-2 bg-white rounded-full p-1 shadow-inner">
                <input type="text" id="inputBuscar" placeholder="Ingresa la marca (ej: Nike)..." 
                       class="w-full px-4 py-2 rounded-full text-gray-800 focus:outline-none">
                <button onclick="buscarPorMarca()" class="bg-gray-900 hover:bg-black text-white px-6 py-2 rounded-full transition-all font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i> BUSCAR
                </button>
            </div>

            <button onclick="formularioZapatilla()" class="bg-white text-orange-600 hover:bg-gray-100 px-6 py-2 rounded-full font-bold transition shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> NUEVO REGISTRO
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        
        <div class="bg-gray-800 rounded-2xl shadow-2xl overflow-hidden border border-gray-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-700/50 text-orange-500 uppercase text-sm">
                        <tr>
                            <th class="p-4 font-sport tracking-wider">Marca</th>
                            <th class="p-4 font-sport tracking-wider">Modelo</th>
                            <th class="p-4 font-sport tracking-wider">Colores</th>
                            <th class="p-4 font-sport tracking-wider">Talla</th>
                            <th class="p-4 font-sport tracking-wider">Catálogo</th>
                            <th class="p-4 font-sport tracking-wider text-center">Gestión de Pedido</th>
                            <th class="p-4 font-sport tracking-wider text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodySneakers" class="divide-y divide-gray-700">
                        </tbody>
                </table>
            </div>
        </div>
        
        <div id="noResults" class="hidden text-center py-20">
            <i class="fa-solid fa-box-open text-6xl text-gray-600 mb-4"></i>
            <p class="text-xl text-gray-400">No se encontraron registros.</p>
            <button onclick="cargarBaseOriginal()" class="mt-4 text-orange-500 underline">Cargar lista original</button>
        </div>
    </main>

    <script>
        // 1. Datos iniciales (10 registros solicitados)
        const listaOriginal = [
            { id: 1, marca: "Nike", modelo: "Air Force 1 '07", colores: "Blanco / Azul", talla: "42", catalogo: "CAT-NK-001", pedido: "PED-9012", telefono: "987654321" },
            { id: 2, marca: "Adidas", modelo: "Ultraboost Light", colores: "Negro / Gris", talla: "40", catalogo: "CAT-AD-045", pedido: "PED-9013", telefono: "951847263" },
            { id: 3, marca: "Puma", modelo: "RS-X Reinvent", colores: "Beige / Rosa", talla: "38", catalogo: "CAT-PM-112", pedido: "PED-9014", telefono: "912345678" },
            { id: 4, marca: "New Balance", modelo: "550 Classic", colores: "Blanco / Verde", talla: "41", catalogo: "CAT-NB-550", pedido: "PED-9015", telefono: "963852741" },
            { id: 5, marca: "Jordan", modelo: "Air Jordan 1 Retro", colores: "Rojo / Negro", talla: "43", catalogo: "CAT-JD-023", pedido: "PED-9016", telefono: "947153286" },
            { id: 6, marca: "Asics", modelo: "Gel-Kayano 29", colores: "Azul / Lima", talla: "42", catalogo: "CAT-AS-223", pedido: "PED-9017", telefono: "935628147" },
            { id: 7, marca: "Reebok", modelo: "Club C 85", colores: "Blanco Vintage", talla: "39", catalogo: "CAT-RB-885", pedido: "PED-9018", telefono: "921748359" },
            { id: 8, marca: "Under Armour", modelo: "Hovr Phantom 3", colores: "Negro Total", talla: "44", catalogo: "CAT-UA-664", pedido: "PED-9019", telefono: "974123658" },
            { id: 9, marca: "Vans", modelo: "Old Skool", colores: "Cuadros B/N", talla: "37", catalogo: "CAT-VS-442", pedido: "PED-9020", telefono: "956321478" },
            { id: 10, marca: "Converse", modelo: "Chuck 70 Hi", colores: "Amarillo Girasol", talla: "36", catalogo: "CAT-CV-331", pedido: "PED-9021", telefono: "989654123" }
        ];

        let zapatillas = JSON.parse(localStorage.getItem('sneakers_db')) || listaOriginal;

        // Renderizar la tabla
        function renderTabla(datos = zapatillas) {
            const tbody = document.getElementById('tbodySneakers');
            const noResults = document.getElementById('noResults');
            tbody.innerHTML = '';

            if (datos.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                datos.forEach(zap => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-700/30 transition-colors";
                    tr.innerHTML = `
                        <td class="p-4 font-bold">${zap.marca}</td>
                        <td class="p-4 text-gray-300">${zap.modelo}</td>
                        <td class="p-4 text-gray-400 text-sm">${zap.colores}</td>
                        <td class="p-4 text-center font-mono">${zap.talla}</td>
                        <td class="p-4"><span class="bg-gray-900 text-orange-400 px-2 py-1 rounded text-xs">${zap.catalogo}</span></td>
                        <td class="p-4 text-center">
                            <button onclick="generarQR('${zap.id}')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2 mx-auto">
                                <i class="fa-solid fa-qrcode"></i> PEDIR WHATSAPP
                            </button>
                        </td>
                        <td class="p-4 text-center">
                            <div class="flex justify-center gap-2">
                                <button onclick="formularioZapatilla('${zap.id}')" class="text-blue-400 hover:text-blue-300 p-2"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="eliminarZapatilla('${zap.id}')" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        // Búsqueda por marca
        function buscarPorMarca() {
            const query = document.getElementById('inputBuscar').value.toLowerCase();
            const filtrados = zapatillas.filter(z => z.marca.toLowerCase().includes(query));
            renderTabla(filtrados);
        }

        // Registrar / Editar Zapatilla
        async function formularioZapatilla(idZap = null) {
            const zap = zapatillas.find(z => z.id == idZap) || { marca: '', modelo: '', colores: '', talla: '', catalogo: '', telefono: '' };
            const esEdicion = idZap !== null;

            const { value: formValues } = await Swal.fire({
                title: esEdicion ? 'EDITAR ZAPATILLA' : 'REGISTRAR NUEVA ZAPATILLA',
                background: '#1f2937',
                color: '#fff',
                html: `
                    <div class="text-left space-y-4 p-2 text-sm">
                        <input id="sw-marca" placeholder="Marca" class="w-full p-3 bg-gray-900 border border-gray-700 rounded" value="${zap.marca}">
                        <input id="sw-modelo" placeholder="Modelo" class="w-full p-3 bg-gray-900 border border-gray-700 rounded" value="${zap.modelo}">
                        <input id="sw-colores" placeholder="Colores" class="w-full p-3 bg-gray-900 border border-gray-700 rounded" value="${zap.colores}">
                        <div class="grid grid-cols-2 gap-2">
                            <input id="sw-talla" placeholder="Talla" class="w-full p-3 bg-gray-900 border border-gray-700 rounded" value="${zap.talla}">
                            <input id="sw-catalogo" placeholder="Código Catálogo" class="w-full p-3 bg-gray-900 border border-gray-700 rounded" value="${zap.catalogo}">
                        </div>
                        <input id="sw-telefono" placeholder="Teléfono para WhatsApp (ej: 51987...)" class="w-full p-3 bg-gray-900 border border-gray-700 rounded" value="${zap.telefono}">
                    </div>
                `,
                focusConfirm: false,
                confirmButtonText: '<i class="fa-solid fa-save"></i> GUARDAR',
                confirmButtonColor: '#ea580c',
                showCancelButton: true,
                cancelButtonText: 'CANCELAR',
                preConfirm: () => {
                    const marca = document.getElementById('sw-marca').value;
                    if (!marca) return Swal.showValidationMessage('La marca es obligatoria');
                    return {
                        id: esEdicion ? zap.id : Date.now(),
                        marca: marca,
                        modelo: document.getElementById('sw-modelo').value,
                        colores: document.getElementById('sw-colores').value,
                        talla: document.getElementById('sw-talla').value,
                        catalogo: document.getElementById('sw-catalogo').value,
                        pedido: zap.pedido || 'PED-' + Math.floor(1000 + Math.random() * 9000),
                        telefono: document.getElementById('sw-telefono').value
                    }
                }
            });

            if (formValues) {
                if (esEdicion) {
                    const index = zapatillas.findIndex(z => z.id == idZap);
                    zapatillas[index] = formValues;
                } else {
                    zapatillas.push(formValues);
                }
                guardarYRefrescar();
                Swal.fire('¡Éxito!', 'Datos guardados correctamente', 'success');
            }
        }

        // Eliminar
        function eliminarZapatilla(id) {
            Swal.fire({
                title: '¿Eliminar registro?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'SÍ, BORRAR',
                background: '#1f2937',
                color: '#fff'
            }).then((result) => {
                if (result.isConfirmed) {
                    zapatillas = zapatillas.filter(z => z.id != id);
                    guardarYRefrescar();
                }
            });
        }

        // Generar QR para Pedido por WhatsApp
        function generarQR(id) {
            const zap = zapatillas.find(z => z.id == id);
            const mensaje = `Hola, quiero hacer un pedido:\nZapatilla: ${zap.marca} ${zap.modelo}\nTalla: ${zap.talla}\nCódigo: ${zap.catalogo}`;
            const urlWs = `https://wa.me/${zap.telefono}?text=${encodeURIComponent(mensaje)}`;

            Swal.fire({
                title: 'ESCANEA PARA PEDIDO',
                html: `
                    <p class="mb-4 text-gray-400 text-sm">Escanea este código con tu celular para enviar el pedido a WhatsApp.</p>
                    <div id="qrcode" class="bg-white p-4 inline-block rounded-xl"></div>
                    <p class="mt-4 font-bold text-orange-500">${zap.marca} ${zap.modelo}</p>
                `,
                showConfirmButton: true,
                confirmButtonText: 'CERRAR',
                didOpen: () => {
                    new QRCode(document.getElementById("qrcode"), {
                        text: urlWs,
                        width: 200,
                        height: 200
                    });
                }
            });
        }

        function guardarYRefrescar() {
            localStorage.setItem('sneakers_db', JSON.stringify(zapatillas));
            renderTabla();
        }

        function cargarBaseOriginal() {
            zapatillas = [...listaOriginal];
            guardarYRefrescar();
        }

        // Inicio
        document.addEventListener('DOMContentLoaded', () => renderTabla());
    </script>
</body>
</html>
