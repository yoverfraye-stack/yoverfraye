<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR Pro</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-top: 0;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .history-section {
            margin-top: 25px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .btn-clear {
            background: #ef4444;
            padding: 6px 12px;
            font-size: 0.85rem;
            width: auto;
            margin: 0;
        }
        .btn-clear:hover { background: #dc2626; }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        li {
            background: var(--bg);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .date {
            display: block;
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Escáner de Códigos QR</h1>
    
    <button id="btn-toggle-cam">Activar Cámara</button>
    
    <div id="reader" style="display: none;"></div>

    <div class="history-section">
        <div class="history-header">
            <h3>Códigos Registrados</h3>
            <button id="btn-clear" class="btn-clear" style="display: none;">Limpiar</button>
        </div>
        <ul id="history-list"></ul>
    </div>
</div>

<script>
    const btnToggleCam = document.getElementById('btn-toggle-cam');
    const btnClear = document.getElementById('btn-clear');
    const historyList = document.getElementById('history-list');
    const readerDiv = document.getElementById('reader');
    
    let html5QrCode;
    let isScanning = false;

    // Cargar historial al iniciar la página
    document.addEventListener('DOMContentLoaded', updateHistoryDOM);

    // Evento para encender/apagar la cámara
    btnToggleCam.addEventListener('click', () => {
        if (!isScanning) {
            startScanner();
        } else {
            stopScanner();
        }
    });

    // Evento para limpiar el historial
    btnClear.addEventListener('click', () => {
        if(confirm("¿Seguro que quieres borrar el historial?")) {
            localStorage.removeItem('qr_history');
            updateHistoryDOM();
        }
    });

    function startScanner() {
        readerDiv.style.display = 'block';
        html5QrCode = new Html5Qrcode("reader");
        
        // Configuración para móviles: 'environment' prioriza la cámara trasera
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        html5QrCode.start(
            { facingMode: "environment" }, 
            config,
            onScanSuccess,
            onScanFailure
        ).then(() => {
            isScanning = true;
            btnToggleCam.textContent = "Detener Cámara";
            btnToggleCam.style.backgroundColor = "#4b5563"; // Cambia a gris
        }).catch((err) => {
            console.error("Error al iniciar la cámara:", err);
            alert("No se pudo acceder a la cámara. Asegúrate de dar permisos y usar HTTPS.");
            readerDiv.style.display = 'none';
        });
    }

    function stopScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                isScanning = false;
                readerDiv.style.display = 'none';
                btnToggleCam.textContent = "Activar Cámara";
                btnToggleCam.style.backgroundColor = "#4f46e5"; // Vuelve al azul
            }).catch((err) => console.error("Error al detener la cámara:", err));
        }
    }

    // Qué hacer cuando encuentra un QR
    function onScanSuccess(decodedText, decodedResult) {
        // Detener la cámara momentáneamente para evitar lecturas repetidas en bucle
        stopScanner();
        
        // Obtener fecha y hora actual
        const now = new Date();
        const dateTimeStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();

        // Guardar en LocalStorage
        saveToLocalStorage(decodedText, dateTimeStr);
        
        // Actualizar la interfaz
        updateHistoryDOM();

        // Pequeña alerta o vibración si el dispositivo lo soporta
        if (navigator.vibrate) navigator.vibrate(200);
        alert(`¡Código detectado!\nContenido: ${decodedText}`);
    }

    function onScanFailure(error) {
        // Este callback se ejecuta constantemente mientras busca un QR. 
        // Lo dejamos vacío para no saturar la consola del navegador.
    }

    function saveToLocalStorage(text, datetime) {
        let history = JSON.parse(localStorage.getItem('qr_history')) || [];
        // Insertamos al principio para que el más reciente salga arriba
        history.unshift({ text, datetime });
        localStorage.setItem('qr_history', JSON.stringify(history));
    }

    function updateHistoryDOM() {
        let history = JSON.parse(localStorage.getItem('qr_history')) || [];
        historyList.innerHTML = '';

        if(history.length === 0) {
            historyList.innerHTML = '<li>No hay códigos escaneados aún.</li>';
            btnClear.style.display = 'none';
            return;
        }

        btnClear.style.display = 'block';
        history.forEach(item => {
            const li = document.createElement('li');
            
            // Si el texto es un enlace, lo hacemos clickeable
            if(item.text.startsWith('http://') || item.text.startsWith('https://')) {
                li.innerHTML = `<a href="${item.text}" target="_blank">${item.text}</a>`;
            } else {
                li.textContent = item.text;
            }
            
            const spanDate = document.createElement('span');
            spanDate.className = 'date';
            spanDate.textContent = `Escaneado el: ${item.datetime}`;
            
            li.appendChild(spanDate);
            historyList.appendChild(li);
        });
    }
</script>

</body>
</html>
